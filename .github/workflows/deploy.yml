name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Injects basePath for the github.io project URL — do not hardcode one.
      - uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - run: npm ci

      # Public intake API (Cloudflare Tunnel from Arthur's rig; see docs/HANDOFF.md).
      # Inlined at build time; without it the consult page falls back to the email notice.
      - run: npm run build
        env:
          NEXT_PUBLIC_INTAKE_API: https://intake.rothrocklegal.com

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
